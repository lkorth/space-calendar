<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Calendar — Configure Your Feed</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0a0a0f; color: #e0e0e8; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 640px; margin: 0 auto; }
    .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 0.5rem; }
    h1 { font-size: 1.75rem; font-weight: 700; }
    .github-link { color: #6060a0; flex-shrink: 0; margin-top: 4px; }
    .github-link:hover { color: #9090c0; }
    .subtitle { color: #9090a8; margin-bottom: 2rem; line-height: 1.5; }
    .section-label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6060a0; margin: 1.5rem 0 0.75rem; }
    .category { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.6rem 0; border-bottom: 1px solid #1a1a2e; }
    .category:last-child { border-bottom: none; }
    .category input[type="checkbox"] { margin-top: 3px; accent-color: #7060ff; width: 16px; height: 16px; flex-shrink: 0; cursor: pointer; }
    .category label { cursor: pointer; }
    .category-name { font-weight: 500; }
    .category-desc { font-size: 0.85rem; color: #8080a0; margin-top: 2px; }
    .expandable { display: none; margin-top: 0.75rem; padding: 0.75rem; background: #12122a; border-radius: 6px; border: 1px solid #2a2a4a; }
    .expandable input[type="text"], .expandable input[type="number"] { width: 100%; padding: 0.5rem 0.75rem; background: #0a0a1f; border: 1px solid #3a3a6a; border-radius: 4px; color: #e0e0e8; font-size: 0.9rem; }
    .expandable input[type="text"]:focus, .expandable input[type="number"]:focus { outline: none; border-color: #7060ff; }
    .hemi-radios { display: flex; gap: 1.25rem; margin-bottom: 0.75rem; }
    .hemi-radios label { font-size: 0.85rem; color: #9090a8; cursor: pointer; display: flex; align-items: center; gap: 0.35rem; }
    .hemi-radios input[type="radio"] { accent-color: #7060ff; cursor: pointer; }
    .hemi-inputs > div { display: none; }
    .hemi-inputs > div.active { display: block; }
    .geo-row { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .btn-location { background: #1a1a2e; color: #9090c0; border: 1px solid #3a3a6a; padding: 0.4rem 0.85rem; font-size: 0.85rem; border-radius: 4px; cursor: pointer; flex-shrink: 0; font-weight: 500; }
    .btn-location:hover { background: #2a2a4e; color: #c0c0e8; }
    .geo-or { font-size: 0.8rem; color: #5050a0; flex-shrink: 0; }
    .geo-lat { flex: 1; min-width: 80px; }
    .geo-note { font-size: 0.78rem; color: #6060a0; margin-top: 0.5rem; line-height: 1.4; display: none; }
    .location-note { font-size: 0.78rem; color: #6060a0; margin-top: 0.5rem; line-height: 1.4; }
    .location-note a { color: #9080ff; }
    .solstices-hemi { display: none; margin-top: 0.5rem; }
    .solstices-hemi label { font-size: 0.85rem; color: #9090a8; cursor: pointer; display: inline-flex; align-items: center; gap: 0.35rem; margin-right: 1.25rem; }
    .solstices-hemi input[type="radio"] { accent-color: #7060ff; cursor: pointer; }
    .output { margin-top: 2rem; padding: 1.25rem; background: #0f0f20; border: 1px solid #2a2a4a; border-radius: 8px; }
    .output-label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6060a0; margin-bottom: 0.5rem; }
    .url-display { font-family: monospace; font-size: 0.8rem; color: #a0a0c0; word-break: break-all; background: #08081a; padding: 0.75rem; border-radius: 4px; margin-bottom: 0.75rem; min-height: 2.5rem; }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    button { padding: 0.5rem 1rem; border: none; border-radius: 4px; font-size: 0.9rem; cursor: pointer; font-weight: 500; }
    .btn-copy { background: #7060ff; color: white; }
    .btn-copy:hover { background: #8070ff; }
    .btn-google { background: #1a1a2e; color: #e0e0e8; border: 1px solid #3a3a6a; }
    .btn-google:hover { background: #2a2a4e; }
    .empty-msg { color: #6060a0; font-size: 0.9rem; }
    .copied { background: #306030 !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Space Calendar</h1>
      <a class="github-link" href="https://github.com/lkorth/space-calendar" aria-label="View on GitHub">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.385-1.335-1.755-1.335-1.755-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
      </a>
    </div>
    <p class="subtitle">Select the categories you want and subscribe in any calendar app that supports ICS feeds — Google Calendar, Apple Calendar, Outlook, and more.</p>

    <div class="section-label">Sky Events</div>
    <div class="category"><input type="checkbox" id="moon-phases" value="moon-phases" /><label for="moon-phases"><div class="category-name">Moon Phases</div><div class="category-desc">New moon and full moon</div></label></div>
    <div class="category"><input type="checkbox" id="meteor-showers" value="meteor-showers" /><label for="meteor-showers"><div class="category-name">Meteor Showers</div><div class="category-desc">Peak activity nights for annual showers</div></label></div>
    <div class="category"><input type="checkbox" id="eclipses-solar" value="eclipses-solar" /><label for="eclipses-solar"><div class="category-name">Solar Eclipses</div><div class="category-desc">Total, annular, and partial solar eclipses worldwide</div></label></div>
    <div class="category"><input type="checkbox" id="eclipses-lunar" value="eclipses-lunar" /><label for="eclipses-lunar"><div class="category-name">Lunar Eclipses</div><div class="category-desc">Total, partial, and penumbral lunar eclipses worldwide</div></label></div>
    <div class="category">
      <input type="checkbox" id="solstices-equinoxes" value="solstices-equinoxes" onchange="toggleSolsticesHemi(this.checked)" />
      <label for="solstices-equinoxes" style="flex:1">
        <div class="category-name">Solstices & Equinoxes</div>
        <div class="category-desc">The four astronomical seasons</div>
        <div class="solstices-hemi" id="solstices-hemi">
          <label><input type="radio" name="solstices-hemi" value="north" checked onchange="update()"> Northern Hemisphere</label>
          <label><input type="radio" name="solstices-hemi" value="south" onchange="update()"> Southern Hemisphere</label>
        </div>
      </label>
    </div>

    <div class="section-label">Planetary Events</div>
    <div class="category"><input type="checkbox" id="oppositions" value="oppositions" /><label for="oppositions"><div class="category-name">Planetary Oppositions</div><div class="category-desc">Best nights to view Mars, Jupiter, Saturn, and more</div></label></div>
    <div class="category"><input type="checkbox" id="elongations" value="elongations" /><label for="elongations"><div class="category-name">Mercury & Venus Elongations</div><div class="category-desc">Best windows to spot inner planets</div></label></div>
    <div class="category"><input type="checkbox" id="asteroids" value="asteroids" /><label for="asteroids"><div class="category-name">Asteroid Close Approaches</div><div class="category-desc">Significant Earth flybys worth tracking</div></label></div>
    <div class="category"><input type="checkbox" id="comets" value="comets" /><label for="comets"><div class="category-name">Comets</div><div class="category-desc">Perihelion, closest approach, and naked-eye visibility windows</div></label></div>

    <div class="section-label">Launches & History</div>
    <div class="category"><input type="checkbox" id="launches" value="launches" /><label for="launches"><div class="category-name">Rocket Launches</div><div class="category-desc">Crewed missions, maiden flights, heavy-lift vehicles, and flagship science payloads — no routine launches</div></label></div>
    <div class="category"><input type="checkbox" id="history" value="history" /><label for="history"><div class="category-name">Space History Milestones</div><div class="category-desc">20, 25, 50, 75, and 100-year anniversaries of landmark moments in spaceflight</div></label></div>

    <div class="section-label">Deep Sky</div>
    <div class="category"><input type="checkbox" id="deep-sky" value="deep-sky" /><label for="deep-sky"><div class="category-name">Messier Marathon</div><div class="category-desc">The annual new-moon night in March when all 110 Messier objects can be observed in one night</div></label></div>

    <div class="section-label">Location-Aware</div>
    <div class="category">
      <input type="checkbox" id="aurora" onchange="toggleAuroraSection(this.checked)" />
      <label for="aurora" style="flex:1">
        <div class="category-name">Aurora Forecasts</div>
        <div class="category-desc">Events when a storm is forecasted to be visible at your latitude, based on NOAA's 3-day Kp forecast</div>
        <div class="expandable" id="aurora-section">
          <div class="geo-row" style="margin-bottom:0.75rem">
            <button class="btn-location" type="button" onclick="useGeolocation()">Use my location</button>
            <span class="geo-or">— detects hemisphere automatically</span>
          </div>
          <div class="geo-note" id="geo-note"></div>
          <div class="hemi-radios">
            <label><input type="radio" name="aurora-hemi" value="north" checked onchange="onAuroraHemiChange('north')"> Northern Hemisphere</label>
            <label><input type="radio" name="aurora-hemi" value="south" onchange="onAuroraHemiChange('south')"> Southern Hemisphere</label>
          </div>
          <div class="hemi-inputs">
            <div id="aurora-north" class="active">
              <input type="text" id="zip-input" placeholder="US zip code or Canadian postal code (e.g. 80301 or T2P)" maxlength="7" oninput="onZipInput(this.value)" />
            </div>
            <div id="aurora-south">
              <input type="number" id="australis-lat-input" placeholder="Latitude in degrees (e.g. -45 for New Zealand)" min="-90" max="90" step="1" oninput="onAustralisLatInput(this.value)" />
              <div class="location-note" style="margin-top:0.4rem">To find your latitude, search <a href="https://www.google.com/search?q=my+latitude" target="_blank">my latitude</a> in Google, or open Google Maps, long-press your location, and read the first number.</div>
            </div>
          </div>
          <div class="location-note">
            ⚠️ Calendar apps sync every few hours — aurora events 1–3 days out will appear in time, but same-day storms may not. For real-time alerts, supplement with <a href="https://www.spaceweatherlive.com/" target="_blank">SpaceWeatherLive</a>.
          </div>
        </div>
      </label>
    </div>

    <div class="output">
      <div class="output-label">Your Subscription URL</div>
      <div class="url-display" id="url-display"><span class="empty-msg">Select at least one category above</span></div>
      <div class="actions">
        <button class="btn-copy" id="btn-copy" onclick="copyUrl()" disabled>Copy URL</button>
        <button class="btn-google" id="btn-google" onclick="addToGoogle()" disabled>Add to Google Calendar</button>
      </div>
    </div>
  </div>

  <script>
    const WORKER_BASE = 'https://space-calendar.lukekorth.com';
    let resolvedLat = null;  // northern aurora: from zip lookup
    let australisLat = null; // southern aurora: from geolocation or manual input
    const detectedTZ = Intl.DateTimeFormat().resolvedOptions().timeZone;

    function toggleAuroraSection(checked) {
      document.getElementById('aurora-section').style.display = checked ? 'block' : 'none';
      update();
    }

    function onAuroraHemiChange(hemi) {
      document.getElementById('aurora-north').classList.toggle('active', hemi === 'north');
      document.getElementById('aurora-south').classList.toggle('active', hemi === 'south');
      update();
    }

    function toggleSolsticesHemi(checked) {
      document.getElementById('solstices-hemi').style.display = checked ? 'block' : 'none';
      update();
    }

    async function onZipInput(value) {
      value = value.trim().toUpperCase();
      if (!value) { resolvedLat = null; update(); return; }
      const lat = await lookupLatitude(value);
      resolvedLat = lat !== null ? Math.round(lat) : null;
      update();
    }

    async function lookupLatitude(zip) {
      try {
        const res = await fetch('zip-latitudes.json');
        const db = await res.json();
        const key = zip.replace(/\s+/g, '').toUpperCase().slice(0, zip.length >= 5 && /^\d/.test(zip) ? 5 : 3);
        return db[key] ?? null;
      } catch { return null; }
    }

    function onAustralisLatInput(value) {
      const parsed = parseInt(value.trim());
      australisLat = (!isNaN(parsed) && parsed >= -90 && parsed <= 90) ? parsed : null;
      update();
    }

    function useGeolocation() {
      if (!navigator.geolocation) {
        showGeoNote('Geolocation is not supported by your browser — select your hemisphere and enter a location below.');
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = Math.round(pos.coords.latitude);
          const hemi = lat >= 0 ? 'north' : 'south';
          // Auto-select hemisphere radio
          const radio = document.querySelector(`input[name="aurora-hemi"][value="${hemi}"]`);
          if (radio) { radio.checked = true; onAuroraHemiChange(hemi); }
          // Populate the right input
          if (hemi === 'north') {
            resolvedLat = lat;
          } else {
            australisLat = lat;
            document.getElementById('australis-lat-input').value = lat;
          }
          const dir = lat >= 0 ? 'N' : 'S';
          showGeoNote(`Detected: ${Math.abs(lat)}°${dir} — ${hemi === 'north' ? 'Northern' : 'Southern'} Hemisphere`);
          update();
        },
        () => {
          showGeoNote('Could not get your location — select your hemisphere and enter a location below.');
        }
      );
    }

    function showGeoNote(msg) {
      const el = document.getElementById('geo-note');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function getAuroraSlug() {
      if (!document.getElementById('aurora').checked) return null;
      const hemi = document.querySelector('input[name="aurora-hemi"]:checked')?.value ?? 'north';
      return hemi === 'south' ? 'aurora-australis' : 'aurora';
    }

    function getAuroraLat() {
      const slug = getAuroraSlug();
      if (slug === 'aurora') return resolvedLat;
      if (slug === 'aurora-australis') return australisLat;
      return null;
    }

    function getSolsticesHemi() {
      return document.querySelector('input[name="solstices-hemi"]:checked')?.value ?? 'north';
    }

    function getSelectedCategories() {
      const cats = Array.from(document.querySelectorAll('input[type="checkbox"]:checked'))
        .filter(el => el.id !== 'aurora')
        .map(el => el.value);
      const auroraSlug = getAuroraSlug();
      if (auroraSlug) cats.push(auroraSlug);
      return cats;
    }

    function buildUrl(categories, auroraLat, solsticesHemi) {
      const url = new URL('/feed.ics', WORKER_BASE);
      url.searchParams.set('c', categories.join(','));
      const hasAurora = categories.includes('aurora') || categories.includes('aurora-australis');
      if (hasAurora && auroraLat !== null) url.searchParams.set('lat', auroraLat);
      if (solsticesHemi === 'south') url.searchParams.set('hemi', 'south');
      if (detectedTZ) url.searchParams.set('tz', detectedTZ);
      return url.toString();
    }

    function update() {
      const categories = getSelectedCategories();
      const auroraSlug = getAuroraSlug();
      const auroraLat = getAuroraLat();
      const auroraReady = !auroraSlug || auroraLat !== null;
      const solsticesHemi = getSolsticesHemi();
      const ready = categories.length > 0 && auroraReady;

      const display = document.getElementById('url-display');
      const btnCopy = document.getElementById('btn-copy');
      const btnGoogle = document.getElementById('btn-google');

      if (categories.length === 0) {
        display.innerHTML = '<span class="empty-msg">Select at least one category above</span>';
      } else if (auroraSlug === 'aurora' && resolvedLat === null) {
        display.innerHTML = '<span class="empty-msg">Enter a valid zip or postal code for aurora</span>';
      } else if (auroraSlug === 'aurora-australis' && australisLat === null) {
        display.innerHTML = '<span class="empty-msg">Enter your location for Aurora Australis</span>';
      } else {
        display.textContent = buildUrl(categories, auroraLat, solsticesHemi);
      }

      btnCopy.disabled = !ready;
      btnGoogle.disabled = !ready;
    }

    function copyUrl() {
      const url = buildUrl(getSelectedCategories(), getAuroraLat(), getSolsticesHemi());
      navigator.clipboard.writeText(url).then(() => {
        const btn = document.getElementById('btn-copy');
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy URL'; btn.classList.remove('copied'); }, 2000);
      });
    }

    function addToGoogle() {
      const url = buildUrl(getSelectedCategories(), getAuroraLat(), getSolsticesHemi()).replace(/^https:\/\//, 'webcal://');
      const googleUrl = 'https://calendar.google.com/calendar/r?cid=' + encodeURIComponent(url);
      window.open(googleUrl, '_blank');
    }

    document.querySelectorAll('input[type="checkbox"]').forEach(el => {
      if (el.id !== 'aurora' && el.id !== 'solstices-equinoxes') {
        el.addEventListener('change', update);
      }
    });
  </script>
</body>
</html>
