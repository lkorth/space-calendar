name: Deploy Worker

on:
  workflow_run:
    workflows: ["Test"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write # to look up the last successful run and start the e2e tests

jobs:
  deploy:
    # For workflow_run: only proceed if tests passed. workflow_dispatch always runs.
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Compares with the commit of the last successful run of this workflow, not HEAD^: a
      # push can hold several commits, and a commit whose tests or deploy failed is still
      # waiting to ship. Every successful run either deployed or found nothing to deploy, so
      # everything up to its commit is live. When the base is unknown, deploy.
      - name: Check if worker-related files changed
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-worker.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty') || base=''
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable base commit (got '$base'), deploying"
            changed=true
          elif git diff --name-only "$base" HEAD | grep -E '^(src/worker/|src/shared/|src/site/|wrangler\.toml|package(-lock)?\.json|\.github/workflows/deploy-worker\.yml)'; then
            echo "Worker files changed since $base"
            changed=true
          else
            echo "No worker files changed since $base"
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'

      - name: Type check worker
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npx tsc -p tsconfig.worker.json --noEmit

      - name: Deploy to Cloudflare Workers
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npx wrangler deploy --var DEPLOY_ID:$(git rev-parse --short HEAD)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A separate workflow, so a failing test does not mark this run as failed. The check
      # above reads a failed run as "not deployed" and would deploy again on every push.
      - name: Start e2e tests
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: gh workflow run e2e-tests.yml --ref "$GITHUB_REF_NAME" || echo "::warning::Could not start the e2e tests"
        env:
          GH_TOKEN: ${{ github.token }}
