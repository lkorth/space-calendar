name: Generate Monthly Data

on:
  schedule:
    - cron: '0 6 1 * *'  # 1st of each month at 06:00 UTC
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run monthly generators
        run: npm run pipeline:monthly

      - name: Push to Cloudflare KV
        run: |
          for file in data/asteroids.json; do
            key="static:$(basename "$file" .json)"
            npx wrangler kv key put --binding CALENDAR_KV "$key" --path "$file"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/asteroids.json
          git diff --staged --quiet || git commit -m "chore: update asteroid close approach data $(date -u +%Y-%m)"
          git push
