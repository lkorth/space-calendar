name: Regenerate on YAML Change

on:
  push:
    branches: [main]
    paths:
      - 'history.yaml'
      - 'comets.yaml'

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Regenerate history if changed
        if: contains(github.event.commits[0].modified, 'history.yaml') || contains(github.event.commits[0].added, 'history.yaml')
        run: npm run pipeline -- --generator history

      - name: Regenerate comets if changed
        if: contains(github.event.commits[0].modified, 'comets.yaml') || contains(github.event.commits[0].added, 'comets.yaml')
        run: npm run pipeline -- --generator comets

      - name: Push updated files to Cloudflare KV
        run: |
          for slug in history comets; do
            file="data/${slug}.json"
            if [ -f "$file" ]; then
              npx wrangler kv key put --binding CALENDAR_KV "static:${slug}" --path "$file"
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/comets.json
          git diff --staged --quiet || git commit -m "chore: regenerate data from updated YAML"
          git push
