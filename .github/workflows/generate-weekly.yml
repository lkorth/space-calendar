name: Generate Weekly Data

on:
  schedule:
    - cron: '0 6 * * 0'  # Every Sunday at 06:00 UTC
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run weekly generators
        run: npm run pipeline:weekly

      - name: Push to Cloudflare KV
        run: |
          for file in data/comets.json; do
            key="static:$(basename "$file" .json)"
            npx wrangler kv key put --binding CALENDAR_KV "$key" --path "$file" --remote
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/comets.json
          git diff --staged --quiet || git commit -m "chore: update comet data $(date -u +%Y-%m-%d)"
          git push
