name = "space-calendar"
main = "src/worker/index.ts"
compatibility_date = "2024-04-05"

routes = [
  { pattern = "space-calendar.lukekorth.com", custom_domain = true }
]

# The configurator is served from the same domain as the feed. Static assets are matched
# before the Worker runs, so page loads never invoke it — those requests are free and
# unlimited — while /feed.ics and /feed.json fall through to the Worker as usual.
[assets]
directory = "./src/site"


[observability.logs]
enabled = true
invocation_logs = true

[[kv_namespaces]]
binding = "CALENDAR_KV"
id = "759d32e9e73443319985fbf1078cf70b"
